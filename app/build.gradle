apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
// REMOVED: kotlin-android-extensions plugin (deprecated in Kotlin 1.8+, removed in 2.0+)
// COMPLETED: All activities and extension classes migrated to ViewBinding
// Now using Kotlin 2.0.21 with full ViewBinding support

android {
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.mckimquyen.atomicPeriodicTable"
        minSdkVersion 23
        //noinspection EditedTargetSdkVersion
        targetSdkVersion 36
        versionCode 20260410
        versionName "2026.04.10"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Vector drawable support for API < 21
        vectorDrawables.useSupportLibrary = true

        // Resource optimization - keep only specified languages
        // Add your supported languages here (e.g., 'en', 'vi', 'zh', etc.)
        // Remove this if you want to support all languages
        // resConfigs 'en', 'vi'
    }
    buildTypes {
        debug {
            buildConfigField "String", "ADMOB_BANNER_ID", "\"ca-app-pub-3940256099942544/6300978111\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"ca-app-pub-3940256099942544/1033173712\""
            buildConfigField "String", "ADMOB_APP_OPEN_ID", "\"ca-app-pub-3940256099942544/9257395921\""
        }

        release {
            // nhớ check APPLICATION_ID trong manifest
            buildConfigField "String", "ADMOB_BANNER_ID", "\"ca-app-pub-3612191981543807/1070088796\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"ca-app-pub-3612191981543807/9709343750\""
            buildConfigField "String", "ADMOB_APP_OPEN_ID", "\"ca-app-pub-3612191981543807/9715699725\""

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
//            signingConfig signingConfigs.config
            android.applicationVariants.all { variant ->
                variant.outputs.all {}
            }
        }
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        jvmToolchain(17)
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // ===============================================================
    // APK/AAB Size Optimization
    // ===============================================================

    // Split APKs by ABI for smaller individual APK sizes
    // Google Play will automatically serve the right APK for each device
    // DISABLED: Conflicts with App Bundle builds (AAB handles splitting automatically)
    splits {
        abi {
            enable false
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk false // Set true if you need a universal APK
        }
    }

    // Packaging options to reduce APK size
    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module',
                'META-INF/gradle/incremental.annotation.processors'
            ]
        }
    }

    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword KS_PW
            keyAlias KS_ALIAS
            keyPassword KS_PW
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true // Remove unused resources
            //used android.enableR8=true in gradle.properties for R8 full mode
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
//            applicationIdSuffix ".release"

            // Optimize for smaller APK/AAB size
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE' // Smaller native debug symbols
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            //used android.enableR8=true in gradle.properties
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
//            applicationIdSuffix ".debug"
        }
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def abiFilter = output.getFilter(com.android.build.OutputFile.ABI)
            def abiSuffix = abiFilter != null ? "_${abiFilter}" : ""
            outputFileName = defaultConfig.applicationId + buildType.name + abiSuffix + "_" + defaultConfig.versionName + "_" + defaultConfig.versionCode + ".apk"
        }
    }

    flavorDimensions.add("type")
    productFlavors {

        dev {
//            applicationId = "com.mckimquyen.atomicPeriodicTable.dev"
            dimension "type"
            buildConfigField("String", "FLAVOR_buildEnv", '"dev"')
            resValue "string", "app_name", "Periodic Table DEV"

//            resValue("string", "SDK_KEY", "e75FnQfS9XTTqM1Kne69U7PW_MBgAnGQTFvtwVVui6kRPKs5L7ws9twr5IQWwVfzPKZ5pF2IfDa7lguMgGlCyt")
//            resValue("string", "BANNER", "7c47d522e938927b")
//            resValue("string", "INTER", "fca03a66d93f71df")
//            resValue("string", "EnableAdInter", "true")
//            resValue("string", "EnableAdBanner", "true")
        }

        production {
//            applicationId = "com.mckimquyen.atomicPeriodicTable.prod"
            dimension "type"
            buildConfigField("String", "FLAVOR_buildEnv", '"prod"')
            resValue "string", "app_name", "Periodic Table"

//            resValue("string", "SDK_KEY", "e75FnQfS9XTTqM1Kne69U7PW_MBgAnGQTFvtwVVui6kRPKs5L7ws9twr5IQWwVfzPKZ5pF2IfDa7lguMgGlCyt")
//            resValue("string", "BANNER", "7c47d522e938927b")
//            resValue("string", "INTER", "fca03a66d93f71df")
//            resValue("string", "EnableAdInter", "true")
//            resValue("string", "EnableAdBanner", "true")
        }

    }
    namespace 'com.mckimquyen.atomicPeriodicTable'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // Kotlin stdlib - updated to 2.2.20 (Jan 2025)
    // All activities and extension classes migrated from kotlin-android-extensions to ViewBinding
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
    // AndroidX AppCompat - updated to 1.7.1 (latest stable, tương thích Android 15+)
    implementation 'androidx.appcompat:appcompat:1.7.1'
    // AndroidX Core KTX - updated to 1.17.0 (Jan 2025) - QUAN TRỌNG cho performance
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'com.github.ultimate-deej:twowaynestedscrollview:0.1'
//    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Gson - updated to 2.13.2 (Dec 2024)
    implementation 'com.google.code.gson:gson:2.13.2'
//    implementation 'com.jakewharton:butterknife:10.1.0'
//    implementation 'androidx.cardview:cardview:1.0.0'
    // OkHttp - updated to 5.2.1 (Jan 2025, stable) - Requires minSdk 21+, project uses 23 ✓
    // Note: OkHttp 5.x has breaking changes, test thoroughly after update
    implementation 'com.squareup.okhttp3:okhttp:5.2.1'
//    implementation 'com.github.ar-android:AndroidSvgLoader:1.0.2'
//    implementation 'com.chauthai.overscroll:overscroll-bouncy:0.1.1'
    implementation 'com.sothree.slidinguppanel:library:3.4.0'
    implementation 'com.squareup.picasso:picasso:2.71828'
//    implementation 'com.beust:klaxon:5.0.1'
//    implementation 'com.github.mmin18:realtimeblurview:1.2.1'
    // Material Components - updated to 1.13.0 (Dec 2024, hỗ trợ Material3, performance improvements)
    implementation 'com.google.android.material:material:1.13.0'
    // Coroutines - updated to 1.10.2 (Jan 2025) cho async file I/O và background tasks
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
//    implementation 'androidx.browser:browser:1.8.0'
    // DragDropSwipeRecyclerView - updated to 1.2.0 (Dec 2024)
    implementation 'com.ernestoyaquello.dragdropswiperecyclerview:drag-drop-swipe-recyclerview:1.2.0'
    implementation 'com.otaliastudios:zoomlayout:1.9.0'
//    implementation 'com.applovin:applovin-sdk:13.2.0'
    // Google Play Services Ads - 24.7.0 (latest stable 2024)
    // QUAN TRỌNG: Test kỹ AdMob sau khi update, đặc biệt banner và interstitial ads
    implementation("com.google.android.gms:play-services-ads:24.7.0")
    // AppLovin Mediation Adapter - 13.4.0.0 (tương thích với play-services-ads:24.7.0)
    implementation("com.google.ads.mediation:applovin:13.4.0.0")

//    testImplementation 'junit:junit:4.13.2'
//    androidTestImplementation 'androidx.test:runner:1.5.2'
//    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
//    annotationProcessor 'com.jakewharton:butterknife-compiler:10.1.0'

    // debugImplementation because LeakCanary should only run in debug builds.
//    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
    // Google Play In-App Review - updated to 2.0.2 (Dec 2024)
    implementation("com.google.android.play:review:2.0.2")
    implementation("com.google.android.play:review-ktx:2.0.2")
    // Lifecycle Runtime KTX - updated to 2.9.4 (Jan 2025, hỗ trợ repeatOnLifecycle, performance tốt hơn)
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.4"
    // ProcessPhoenix - for clean app restart when changing language
    implementation 'com.jakewharton:process-phoenix:3.0.0'
}
